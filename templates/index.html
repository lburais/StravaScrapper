<!DOCTYPE html>
<html>
<head>
    <title>Strava Book</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        select { padding: 5px; }
        #activity_details { border: 1px solid #ddd; padding: 10px; margin-top: 20px; background: #fff; }
        img { max-width: 300px; margin: 10px; }

        /* Rendre la zone de texte scrollable */
        textarea {
            width: 100%;
            height: 300px;
            resize: none;
            overflow-y: scroll;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>Strava Book</h1>

    <button onclick="window.location.href='/login'">Login</button>
    <button onclick="window.location.href='/collect'">Get Activities</button>

    <iframe name="log_output" style="width: 100%; height: 800px; border: 1px solid #ddd;"></iframe>

</body>
</html>
